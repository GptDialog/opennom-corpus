name: validate-corpus

# Проверка идёт один раз, на PR. Раньше push на любую ветку плюс pull_request
# давали по два прогона на каждый коммит PR и третий после мержа. main защищён
# ruleset'ом: мерж только из PR с зелёной обязательной проверкой и свежей
# веткой (01.10.2026, решение владельца).
on:
  pull_request:

permissions:
  contents: read

# Новый коммит в PR останавливает прошлый прогон этого же PR.
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas

      - name: Validate corpus
        run: python scripts/validate.py

      - name: Recompute counts
        run: python scripts/counts.py

      - name: Fail if counts.json is stale
        run: |
          if ! git diff --quiet -- counts.json; then
            echo "::error::counts.json устарел. Запусти 'python scripts/counts.py' и закоммить."
            git --no-pager diff -- counts.json
            exit 1
          fi
